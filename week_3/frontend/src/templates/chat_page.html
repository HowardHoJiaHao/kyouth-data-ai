<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resume Helper Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
      body {
        background-color: #f4f6f9;
      }
      .chat-window {
        max-width: 850px;
        margin: 40px auto;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
        height: 82vh;
      }
      .chat-body {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        background-color: #fafbfc;
        border-bottom: 1px solid #eef1f5;
      }
      .msg-bubble {
        margin-bottom: 16px;
        padding: 12px 18px;
        border-radius: 18px;
        max-width: 75%;
        word-wrap: break-word;
        line-height: 1.5;
      }
      .msg-bubble.user {
        background-color: #0d6efd;
        color: #ffffff;
        margin-left: auto;
        border-bottom-right-radius: 4px;
      }
      .msg-bubble.bot {
        background-color: #f1f3f5;
        color: #212529;
        margin-right: auto;
        border-bottom-left-radius: 4px;
      }
      .pdf-badge {
        font-size: 0.85rem;
        background-color: rgba(255, 255, 255, 0.25);
        padding: 4px 8px;
        border-radius: 6px;
        display: inline-block;
        margin-top: 6px;
        font-family: monospace;
      }
    </style>
  </head>
  <body>

    <div class="chat-window">
      <div class="p-3 bg-dark text-white rounded-top d-flex align-items-center">
        <div class="ms-2">
          <h5 class="mb-0">Resume Helper Chatbot</h5>
          <small class="text-muted">Day 3: Custom Naming Layout Active</small>
        </div>
      </div>

      <div class="chat-body" id="chatHistory">
        <div class="msg-bubble bot">
          Hello! I am your Resume Helper. You can ask me career questions or upload your resume PDF to get started.
        </div>
      </div>

      <div class="p-3 bg-white rounded-bottom">
        <form id="chatForm">
            <div class="input-group">
            <input type="file" id="pdfFile" accept=".pdf" class="d-none">
            <button type="button" class="btn btn-outline-secondary d-flex align-items-center" onclick="document.getElementById('pdfFile').click()">
                📁 Upload PDF
            </button>
            
            <input type="text" id="userInput" class="form-control" placeholder="Type your message or ask about your uploaded resume..." required autocomplete="off">
            <button type="submit" class="btn btn-primary px-4">Send</button>
            </div>
            <div id="fileUploadStatus" class="small text-success mt-2 px-1 fw-medium"></div>
        </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // Harvest the custom Jinja2 backend domain pointer variable
      const BACKEND_URL = "{{ backend_url }}";

      const chatForm = document.getElementById('chatForm');
      const userInput = document.getElementById('userInput');
      const pdfFile = document.getElementById('pdfFile');
      const chatHistory = document.getElementById('chatHistory');
      const fileUploadStatus = document.getElementById('fileUploadStatus');

      let currentPdfBase64 = null;
      let currentPdfName = null;

      // Handle PDF uploads
      pdfFile.addEventListener('change', () => {
        if (pdfFile.files.length > 0) {
          const file = pdfFile.files[0];
          currentPdfName = file.name;
          fileUploadStatus.textContent = `📄 Attached: ${file.name} (Will bundle with your next message)`;

          const reader = new FileReader();
          reader.onload = function(e) {
            currentPdfBase64 = e.target.result.split(',')[1]; 
          };
          reader.readAsDataURL(file);
        }
      });

      function displayMessage(text, sender, pdfName = null) {
        const wrapper = document.createElement('div');
        wrapper.className = `msg-bubble ${sender}`;
        
        if (pdfName) {
          wrapper.innerHTML = `<div>${text}</div><div class="pdf-badge">📎 Attached: ${pdfName}</div>`;
        } else {
          wrapper.textContent = text;
        }

        chatHistory.appendChild(wrapper);
        chatHistory.scrollTop = chatHistory.scrollHeight;
      }

      // Intercept submit button
      chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const rawText = userInput.value.trim();
        if (!rawText) return;

        displayMessage(rawText, 'user', currentPdfName);

        const payload = {
          message: rawText,
          pdf_data: currentPdfBase64,
          pdf_name: currentPdfName
        };

        // Reset elements
        userInput.value = '';
        pdfFile.value = '';
        fileUploadStatus.textContent = '';
        
        currentPdfBase64 = null;
        currentPdfName = null;

        try {
          const response = await fetch(`${BACKEND_URL}/chat`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          });

          if (!response.ok) throw new Error(`Server returned error status: ${response.status}`);

          const data = await response.json();
          displayMessage(data.response, 'bot');

        } catch (error) {
          displayMessage(`[Connection Failure] Unable to communicate with backend server at ${BACKEND_URL}/chat. Error details: ${error.message}`, 'bot');
        }
      });
    </script>
  </body>
</html>
